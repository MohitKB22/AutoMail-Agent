# Render Blueprint — Streamlit dashboard (Demo Mode works with no API key).
services:
  - type: web
    name: automail-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
